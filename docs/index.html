<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEVERAGE//SEEKER — Evidence Ledger</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#0c111b;color:#f0f3fa;max-width:850px;margin:0 auto;padding:28px}a{color:#7dd3fc}h1{letter-spacing:.04em}article{padding:18px;border:1px solid #394254;border-radius:12px;margin:14px 0;background:#141d2b}small{color:#acb8cf}.tag{color:#a7f3d0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
</head><body><h1>LEVERAGE//SEEKER</h1><p>Reviewed public opportunity evidence. No personal approval or grant award implied.</p><main id="records" aria-live="polite"><p>Loading feed…</p></main><p><a href="https://github.com/wildwrld86/LEVERAGE-SEEKER">View source on GitHub</a></p>
<script>
(async()=>{const main=document.getElementById('records');try{const r=await fetch('./feed.json',{cache:'no-store'});if(!r.ok)throw Error('Feed not found');const feed=await r.json();main.replaceChildren();if(!feed.opportunities.length){main.textContent='No reviewed records yet.';return;}for(const e of feed.opportunities){const article=document.createElement('article'),h=document.createElement('h2'),m=document.createElement('small'),pre=document.createElement('pre'),a=document.createElement('a');h.textContent=e.subject_id;m.className='tag';m.textContent=e.state+' · '+e.recorded_at;pre.textContent=JSON.stringify(e.facts,null,2);a.href=e.source_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Official source';article.append(h,m,pre,a);main.append(article);}}catch(e){main.textContent='Feed unavailable; check GitHub.'}})();
</script></body></html>
