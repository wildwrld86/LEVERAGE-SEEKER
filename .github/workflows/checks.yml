name: Verify public evidence ledger
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/ledger.py validate
      - run: python scripts/ledger.py build --db build/leverage.sqlite --feed docs/feed.json
      - run: git diff --exit-code -- docs/feed.json
      - run: python scripts/compile_daily.py validate
      - run: python scripts/compile_daily.py build
      - run: git diff --exit-code -- docs/intelligence.json
